<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nani Mad Sahad-Professional Profile</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        html { scroll-behavior: smooth; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex; 
            justify-content: center; 
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }
        
        .card { 
            background: white; 
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.08); 
            max-width: 400px; 
            width: 100%; 
            text-align: center; 
            box-sizing: border-box;
            overflow: hidden; 
            transition: all 0.3s ease; 
        }
        
        /* UPDATED: The header now uses flexbox to center the company logo */
        .card-header {
            background: #00A599; 
            height: 140px; /* Slightly taller to fit the logo comfortably */
            width: 100%;
            display: flex;
            justify-content: center;
            padding-top: 20px;
            box-sizing: border-box;
        }

        /* UPDATED: Company Logo styling customized for the header */
        .company-logo { 
            max-width: 160px; 
            max-height: 50px; /* Prevents it from getting too tall */
            object-fit: contain;
        }

        .card-content {
            padding: 0 30px 40px 30px;
        }
        
        .profile-pic { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-top: -60px; 
            position: relative;
            background: white;
        }
        
        h1 { margin: 15px 0 5px 0; font-size: 24px; color: #1a1a1a; font-weight: 700; }
        .subtitle { color: #ED1B2E; font-weight: 600; font-size: 14px; margin-top: 0; margin-bottom: 20px; }
        
        .social-row { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .social-icon {
            display: flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 50%; background: #f0f2f5;
            color: #333; text-decoration: none; font-size: 18px; transition: all 0.2s ease;
        }
        .social-icon:hover { background: #ED1B2E; color: white; transform: scale(1.1); }
        
        .bio-text { color: #555; margin-bottom: 30px; line-height: 1.6; font-size: 14px; }
        
        .btn-row { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .link-btn { 
            display: block; background: #f8f9fa; color: #333; text-decoration: none; 
            padding: 14px; border-radius: 50px; font-weight: 600; font-size: 15px;
            border: 1px solid #e1e4e8; transition: all 0.2s ease; cursor: pointer;
        }
        .link-btn:hover { background: #fdf3f4; border-color: #ED1B2E; color: #ED1B2E; }
        
        .whatsapp-btn { background: #25D366; color: white; border: none; }
        .whatsapp-btn:hover { background: #1ebd5a; color: white; }
        
        .features-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 35px; }
        .feature-item {
            font-size: 11px; font-weight: 600; color: #444; display: flex;
            flex-direction: column; align-items: center; gap: 5px; flex: 1;
        }
        .feature-item i { font-size: 18px; color: #00A599; background: #e6f6f5; padding: 10px; border-radius: 50%; }

        .section-title { text-align: left; font-size: 18px; font-weight: 700; margin-bottom: 5px; }
        .section-subtitle { text-align: left; font-size: 12px; color: #777; margin-bottom: 20px; }
        .section-subtitle i { color: #ED1B2E; }
